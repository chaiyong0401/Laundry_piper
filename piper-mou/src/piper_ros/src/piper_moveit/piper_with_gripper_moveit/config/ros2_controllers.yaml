# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
     # CLIK가 사용할 실시간 속도 기반 컨트롤러 (새로 추가)
    arm_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      joint1: { goal: 0.05 }
      joint2: { goal: 0.05 }
      joint3: { goal: 0.05 }
      joint4: { goal: 0.05 }
      joint5: { goal: 0.05 }
      joint6: { goal: 0.05 }

gripper_controller:
  ros__parameters:
    joints:
      - joint7
      - joint8
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    # gains:
    #   joint7: {p: 80.0, i: 0.1, d: 0.0, i_clamp: 3.0}
    #   joint8: {p: 80.0, i: 0.1, d: 0.0, i_clamp: 3.0}
